<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Massrides</title>
    <link rel="icon" href="/tractor.ico" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #1a5d1a; }
        p { color: #666; line-height: 1.5; }
        .icon { font-size: 4rem; margin-bottom: 1rem; }
        .retry-button {
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background-color: #1a5d1a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
        }
        .retry-button:hover { background-color: #144614; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚜</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your connection. Massrides requires an internet connection to browse parts and manage orders.</p>
        <button class="retry-button" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
